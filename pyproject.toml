[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newport-motor"
version = "0.1.0"
description = "Motor financeiro puro — Sistema de Estudos Newport"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "PyJWT[crypto]>=2.8",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "playwright>=1.49",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "private_corpus: testes que dependem de PDFs reais fora do Git",
]

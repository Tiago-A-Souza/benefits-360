# Robô de TESTE do login real da Porto (correção SUSEP).
# Porta 8602 + pasta saida_teste_porto: NÃO usa rpa/saida nem o tela.db real (8600).
# Cofre: o do Windows (NewportCotacoes/porto). NÃO use teste.cofre: memoria —
# o login guardado neste robô fica disponível depois no robô real (8600).
#
# Subir desta pasta rpa, com --sem-navegador para não abrir o front 5173:
#   python -m app --config config_teste_porto.yaml --sem-navegador
# Front de teste: http://localhost:5176 com VITE_RPA_URL=http://127.0.0.1:8602
#
# Caminhos relativos à pasta deste arquivo. Sem senha, CPF ou SUSEP real aqui.

geral:
  pasta_saida: "saida_teste_porto"
  modo_visual: true            # janela do portal visível para conferir o dropdown SUSEP
  janela_escondida: headless
  lentidao_ms: 150
  mapear: false
  pausa_entre_pedidos_s: 3

tela:
  porta: 8602
  frame_ancestors:
    - http://localhost:5176
    - http://127.0.0.1:5176
  origens_permitidas:
    - http://localhost:5176
    - http://127.0.0.1:5176

